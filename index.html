<!DOCTYPE html>
<html>
<head>
  <title>Awais Snake Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{background:#111;color:white;text-align:center;font-family:Arial;margin:0;padding:10px}
    canvas{background:#222;border:3px solid #00ff00;border-radius:10px}
    button{background:#00ff00;border:none;padding:15px 20px;margin:5px;font-size:20px;border-radius:10px;font-weight:bold}
    .score{font-size:22px;color:#ffcc00}
  </style>
</head>
<body>
  <h1>🐍 AWAIS SNAKE GAME 🐍</h1>
  <p class="score">Score: <span id="score">0</span> | Best: <span id="best">0</span></p>
  <canvas id="game" width="300" height="300"></canvas>
  <br><br>
  <button onclick="changeDir(0,-1)">⬆️</button><br>
  <button onclick="changeDir(-1,0)">⬅️</button>
  <button onclick="changeDir(0,1)">⬇️</button>
  <button onclick="changeDir(1,0)">➡️</button>
  <br><br>
  <button onclick="startGame()" style="background:#ffcc00">RESTART GAME</button>
  <p>Khana khao, bara bano, deewar se mat takrao!</p>
  <p>Made by Awais - Lahore</p>

  <script>
    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");
    var snake, food, dx, dy, score, best = 0, gameLoop;

    function startGame(){
      snake = [{x:150,y:150},{x:135,y:150},{x:120,y:150}];
      dx = 15; dy = 0;
      score = 0;
      document.getElementById("score").innerText = 0;
      makeFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(draw, 200);
    }

    function makeFood(){
      food = {x: Math.floor(Math.random()*20)*15, y: Math.floor(Math.random()*20)*15};
    }

    function changeDir(x,y){
      if(x==1 && dx==-15) return;
      if(x==-1 && dx==15) return;
      if(y==1 && dy==-15) return;
      if(y==-1 && dy==15) return;
      dx = x*15; dy = y*15;
    }

    function draw(){
      ctx.fillStyle = "#222";
      ctx.fillRect(0,0,300,300);

      ctx.fillStyle = "red";
      ctx.fillRect(food.x, food.y, 15, 15);

      var head = {x: snake[0].x + dx, y: snake[0].y + dy};

      if(head.x<0 || head.x>=300 || head.y<0 || head.y>=300){
        alert("Game Over! Score: " + score);
        if(score>best){ best=score; document.getElementById("best").innerText=best; }
        clearInterval(gameLoop);
        return;
      }

      for(var i=0;i<snake.length;i++){
        if(head.x==snake[i].x && head.y==snake[i].y){
          alert("Game Over! Score: " + score);
          clearInterval(gameLoop);
          return;
        }
      }

      snake.unshift(head);

      if(head.x==food.x && head.y==food.y){
        score += 10;
        document.getElementById("score").innerText = score;
        makeFood();
      } else {
        snake.pop();
      }

      ctx.fillStyle = "#00ff00";
      for(var i=0;i<snake.length;i++){
        ctx.fillRect(snake[i].x, snake[i].y, 14, 14);
      }
    }

    document.addEventListener("keydown", function(e){
      if(e.key=="ArrowUp") changeDir(0,-1);
      if(e.key=="ArrowDown") changeDir(0,1);
      if(e.key=="ArrowLeft") changeDir(-1,0);
      if(e.key=="ArrowRight") changeDir(1,0);
    });

    startGame();
  </script>
</body>
</html>
